<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetectAI — Humanity Verification Complete</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; text-align: center; padding: 60px 20px; }
    .card { 
      background: linear-gradient(145deg, #052e16, #0a3d21); 
      border: 2px solid #4ade80; 
      border-radius: 24px; 
      padding: 40px; 
      max-width: 620px; 
      margin: 40px auto; 
      box-shadow: 0 0 40px rgba(74, 222, 128, 0.3);
    }
  </style>
</head>
<body>
  <h1 style="font-size: 32px;">Humanity Protocol Verification</h1>
  <div id="result"></div>

  <script>
    const CLIENT_ID = "app_118754427bfa0cf1383b05090293abdb";
    const REDIRECT_URI = "https://spotlight01.github.io/DetectAi/callback.html";

    async function handleCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171; font-size: 18px;">Verification was cancelled or failed.<br>Please try again.</p>`;
        return;
      }

      if (!code) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">No code received. Please go back and try the upgrade again.</p>`;
        return;
      }

      const codeVerifier = localStorage.getItem("humanity_code_verifier");
      if (!codeVerifier) {
        document.getElementById('result').innerHTML = `<p style="color: #fbbf24;">Session expired. Please start the Humanity upgrade again from the main page.</p>`;
        return;
      }

      try {
        const tokenResponse = await fetch(`https://auth.sandbox.humanity.org/oauth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            client_id: CLIENT_ID,
            redirect_uri: REDIRECT_URI,
            code: code,
            code_verifier: codeVerifier
          })
        });

        const tokenData = await tokenResponse.json();

        if (tokenData.access_token) {
          showSuccessUI(tokenData.app_scoped_user_id || "YOUR-ZK-ID");
        } else {
          document.getElementById('result').innerHTML = `<p style="color: #f59e0b;">Could not complete verification. Please try again.</p>`;
        }
      } catch (err) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">Connection error: ${err.message}<br>Please check your internet and try again.</p>`;
      }
    }

    function showSuccessUI(userId) {
      document.getElementById('result').innerHTML = `
        <div class="card">
          <div style="font-size: 80px; margin-bottom: 20px;">✅ ✋</div>
          <h2 style="color: #4ade80; font-size: 34px;">Success!</h2>
          <p style="font-size: 22px; margin: 15px 0 30px;">You are now <strong>Humanity ZK PoH Verified</strong></p>
          
          <div style="text-align: left; background: rgba(0,0,0,0.4); padding: 25px; border-radius: 16px; font-size: 17px;">
            <p><strong>Human ID:</strong> HID-${(userId || "ZK-PALM").substring(0,12).toUpperCase()}</p>
            <p><strong>Verification Method:</strong> Palm Biometric + Zero-Knowledge Proof</p>
            <p><strong>Humanity Score:</strong> 98%+ (Diamond Tier Unlocked)</p>
            <p><strong>Valid Until:</strong> 10 Years</p>
          </div>

          <button onclick="downloadZKCard()" style="margin-top: 30px; padding: 16px 40px; background: #4ade80; color: black; border: none; border-radius: 9999px; font-size: 18px; font-weight: bold;">
            Download ZK Human ID Card
          </button>
          <button onclick="window.location.href='https://spotlight01.github.io/DetectAi/'" style="margin-top: 15px; padding: 16px 40px; background: transparent; border: 2px solid #4ade80; color: #4ade80; border-radius: 9999px; font-size: 18px;">
            Back to DetectAI Home
          </button>
        </div>
      `;
    }

    function downloadZKCard() {
      alert("🎉 Your new ZK-verified Human ID card is ready!\n\n(In the next update this will download a beautiful PNG/PDF with your palm ZK badge matching your Platinum card style.)");
    }

    // Run the callback automatically when the page loads
    window.onload = handleCallback;
  </script>
</body>
  </html>
