<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DetectAI — Humanity Verification</title>
  <style>
    body { background: #0a0a0a; color: white; font-family: system-ui, sans-serif; text-align: center; padding: 80px 20px; }
    .success { background: #052e16; border: 2px solid #4ade80; border-radius: 24px; max-width: 600px; margin: 40px auto; padding: 60px 40px; }
  </style>
</head>
<body>
  <h1>Completing your Humanity ZK Verification...</h1>
  <div id="result"></div>

  <script>
    const CLIENT_ID = "app_118754427bfa0cf1383b05090293abdb";
    const REDIRECT_URI = "https://spotlight01.github.io/DetectAi/callback.html";
    const ENVIRONMENT = "sandbox";

    async function handleCallback() {
      const urlParams = new URLSearchParams(window.location.search);
      const code = urlParams.get('code');
      const error = urlParams.get('error');

      if (error) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">Verification cancelled or failed: ${error}</p>`;
        return;
      }

      if (!code) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">No authorization code received. Please try again.</p>`;
        return;
      }

      const codeVerifier = localStorage.getItem("humanity_code_verifier");
      if (!codeVerifier) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">Session expired. Please start the upgrade again.</p>`;
        return;
      }

      // Exchange code for token (simple fetch)
      try {
        const tokenResponse = await fetch(`https://auth.${ENVIRONMENT === 'production' ? '' : 'sandbox.'}humanity.org/oauth/token`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({
            grant_type: 'authorization_code',
            client_id: CLIENT_ID,
            redirect_uri: REDIRECT_URI,
            code: code,
            code_verifier: codeVerifier
          })
        });

        const tokenData = await tokenResponse.json();

        if (tokenData.access_token) {
          // Show success (in real app you could call verifyPresets here if you add a backend later)
          showSuccess(tokenData.app_scoped_user_id || "ZK-VERIFIED-USER");
        } else {
          document.getElementById('result').innerHTML = `<p style="color: #f59e0b;">Failed to get token. Please try again.</p>`;
        }
      } catch (err) {
        document.getElementById('result').innerHTML = `<p style="color: #f87171;">Error: ${err.message}</p>`;
      }
    }

    function showSuccess(userId) {
      document.getElementById('result').innerHTML = `
        <div class="success">
          <div style="font-size: 80px; margin-bottom: 20px;">✅</div>
          <h2 style="color: #4ade80; font-size: 36px;">Success! You are now Humanity ZK PoH Verified</h2>
          <p style="font-size: 20px; margin: 20px 0;">Diamond Tier Unlocked • 98% Humanity Score</p>
          
          <div style="background: #111; padding: 25px; border-radius: 16px; text-align: left; font-size: 17px; margin: 30px 0;">
            <p><strong>Your HID:</strong> HID-${userId ? userId.substring(0,12).toUpperCase() : 'ZK-POH'}-PALM</p>
            <p><strong>Verification:</strong> Palm Biometric + Zero-Knowledge Proof</p>
            <p><strong>Valid for:</strong> 10 Years</p>
          </div>

          <button onclick="downloadCard()" style="padding: 16px 40px; background: #4ade80; color: black; border: none; border-radius: 9999px; font-size: 18px; margin: 10px;">Download ZK Human ID Card</button>
          <button onclick="window.location.href='https://spotlight01.github.io/DetectAi/'" style="padding: 16px 40px; background: transparent; border: 2px solid white; color: white; border-radius: 9999px; font-size: 18px; margin: 10px;">Back to DetectAI</button>
        </div>
      `;
    }

    function downloadCard() {
      alert("🎉 Your ZK-verified Human ID card is ready! (In a future update this will auto-download a beautiful PNG/PDF with your palm ZK badge)");
    }

    // Run automatically
    window.onload = handleCallback;
  </script>
</body>
</html>
